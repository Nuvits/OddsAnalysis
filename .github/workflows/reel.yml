name: Make reel

# The site's "Create reel" button opens a pre-filled issue titled "Reel: …" with the analysis as JSON
# (one reel per language). This workflow renders the 30-second videos, attaches them to a release and replies
# on the issue with the links. Only issues opened by the repository owner are processed.
on:
  issues:
    types: [opened]

permissions:
  contents: write   # create the release that holds the videos
  issues: write     # reply and close the issue

concurrency:
  group: reel
  cancel-in-progress: false

jobs:
  reel:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Reel:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      # Optional: read-only deploy key of the private music repository <owner>/odds-memory-music (see README).
      # Without it the videos are silent.
      MUSIC_KEY: ${{ secrets.MUSIC_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Get the background music
        if: env.MUSIC_KEY != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/odds-memory-music
          ssh-key: ${{ env.MUSIC_KEY }}
          path: music
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Remotion and its headless browser, reused between runs
      - name: Cache the video engine
        uses: actions/cache@v4
        with:
          path: ~/.odds-analysis/reels-engine/node_modules
          key: reels-engine-${{ runner.os }}-${{ hashFiles('reels/package.json') }}

      - name: Read the request
        id: props
        run: node .github/scripts/reel-from-issue.js

      - name: Render the videos
        run: node reelrender.js reel-props.json out

      - name: Publish and reply
        env:
          TITLE: ${{ steps.props.outputs.title }}
        run: |
          TAG="reel-$ISSUE"
          gh release create "$TAG" out/*.mp4 --title "Reel: $TITLE" \
            --notes "30-second Instagram Reels (1080×1920). Requested in #$ISSUE."
          BODY="🎬 **Your reels are ready:**"
          for f in out/*.mp4; do
            NAME=$(basename "$f")
            case "$NAME" in *_tr.mp4) LANG_NAME="Turkish" ;; *) LANG_NAME="English" ;; esac
            BODY="$BODY
          - $LANG_NAME: https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$NAME"
          done
          gh issue comment "$ISSUE" --body "$BODY

          Tap a link to download the MP4, then post it on the matching Instagram account."
          gh issue close "$ISSUE"

      - name: Report a failure
        if: failure()
        run: |
          gh issue comment "$ISSUE" --body "⚠️ The reels could not be created. Details: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
