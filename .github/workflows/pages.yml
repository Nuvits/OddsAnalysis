name: Update data and publish

# Downloads bwin odds and results from football-data.co.uk, builds the single-file page
# and publishes it on GitHub Pages.
on:
  schedule:
    - cron: '0 5 * * *'     # daily 05:00 UTC (picks up weekend and midweek results)
    - cron: '30 13 * * 2'   # Tuesday: midweek fixture odds (published by 13:00 UK time)
    - cron: '30 17 * * 5'   # Friday: weekend fixture odds (published by 17:00 UK time)
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # only for the keep-alive empty commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # GitHub disables scheduled workflows in public repos after 60 days without commits.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((45 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled updates alive"
            git push
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Data from the previous run, so finished seasons are not downloaded again.
      - name: Restore previous data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: bwin-data-${{ github.run_id }}
          restore-keys: bwin-data-

      - name: Download data and build the page
        run: node server.js --update
        env:
          ODDS_DATA_DIR: data
          ODDS_STANDALONE: _site/index.html
          ODDS_EMBED_MODE: web
          ODDS_REEL_REPO: ${{ github.repository }}   # enables the "Create reel" button (see reel.yml)

      - name: Save data for the next run
        uses: actions/cache/save@v4
        with:
          path: data
          key: bwin-data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
